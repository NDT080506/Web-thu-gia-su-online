server:
  port: ${PORT:10000}
  servlet:
    context-path: /giasu

spring:
  application:
    name: Web thue gia su online

  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}
  mail:
    from: ${MAIL_FROM}

    app:
      frontend-url: ${FRONTEND_URL}
      backend-url: ${BACKEND_URL}
      mail:
        from: ${MAIL_FROM}
        gmail:
          client-id: ${GMAIL_CLIENT_ID}
          client-secret: ${GMAIL_CLIENT_SECRET}
          refresh-token: ${GMAIL_REFRESH_TOKEN}


jwt:
  signer-key: ${SIGNER_KEY}
  valid-duration: 1
  refreshable-duration: 30
