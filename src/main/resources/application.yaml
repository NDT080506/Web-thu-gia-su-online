server:
  port: ${PORT:10000}
  servlet:
    context-path: /giasu

spring:
  application:
    name: Web thue gia su online

  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}
  mail:
    from: ${MAIL_FROM}
    Gmail:
      client-id: ${GMAIL_CLIENT_ID}
      client-secret: ${GMAIL_CLIENT_SECRET}
      refresh-token: ${GMAIL_REFRESH_TOKEN}

  cleanup:
    cron: "0 * * * * *"
    zone: Asia/Ho_Chi_Minh
    action-log-retention-minutes: 10

jwt:
  signer-key: ${SIGNER_KEY}
  valid-duration: 1
  refreshable-duration: 30

logging:
  level:
    root: INFO
    org.springframework.boot: INFO
    org.springframework.context: DEBUG
    com.zaxxer.hikari: DEBUG
    org.hibernate: INFO