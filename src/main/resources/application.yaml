server:
  port: ${PORT:10000}
  servlet:
    context-path: /giasu


spring:
  application:
    name: Web thue gia su online

  datasource:
    url: ${URL}
    username: ${USERNAME}
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_NAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: ${FRONTEND_URL}
  backend-url: ${BACKEND_URL}

jwt:
  signer-key: ${SIGNER_KEY}
  valid-duration: 1
  refreshable-duration: 30