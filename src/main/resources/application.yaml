server:
  port: ${PORT:8080}
  servlet:
    context-path: /giasu

spring:
  application:
    name: web-thue-gia-su-online

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  valid-duration: 1
  refreshable-duration: 3