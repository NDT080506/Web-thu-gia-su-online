services:
  postgres:
    image: postgres:18
    container_name: webthuegiasuonline
    restart: "no"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: giasu

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: